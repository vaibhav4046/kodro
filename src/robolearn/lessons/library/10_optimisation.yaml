id: 10_optimisation
title: Optimisation (KS4 stretch)
key_stage: KS4
ct_concepts: [algorithmic_efficiency, iteration]
curriculum_refs:
  - "DfE 'Computer Science GCSE subject content' (DfE-00094-2015), section 2 'algorithms': understand the meaning of algorithm efficiency and the relevance of empirical performance comparison."
  - "BCS Csizmadia et al., 2015: algorithmic thinking; evaluation."
prereqs: [08_pathfinding]
terrain: mars
intro: |
  Three samples are scattered across the arena. Collect them all using the
  smallest possible distance travelled. Try a couple of orderings and keep
  the cheapest one -- this is the simplest form of route optimisation.
starter_code: |
  # First pass: walk to each sample, collect it, head home.
  # Sample 1 at (2, 6): turn north, go 5, collect.
  turn_left(90)
  for _ in range(5):
      move_forward(1)
  turn_right(90)
  move_forward(1)
  collect_sample()
  # Sample 2 at (5, 5): south + east a bit.
  turn_right(90)
  move_forward(1)
  turn_left(90)
  for _ in range(3):
      move_forward(1)
  collect_sample()
  # Sample 3 at (7, 2): south then east.
  turn_right(90)
  for _ in range(3):
      move_forward(1)
  turn_left(90)
  for _ in range(2):
      move_forward(1)
  collect_sample()
  # Return to base.
  turn_left(180)
  for _ in range(10):
      move_forward(1)
allowed_constructs: [for, while, function_call, comparison, assignment]
max_lines: 22
world:
  base: [1.0, 1.0]
  samples:
    - [2.0, 6.0]
    - [5.0, 5.0]
    - [7.0, 2.0]
  obstacles: []
  width: 10.0
  height: 8.0
success_criteria:
  - samples_collected: 3
  - returns_to_base: true
  - max_battery_used: 70.0
hints:
  on_failure:
    - "If the rover overshoots, lower the per-step distance from 0.5 m to 0.2 m."
    - "Compare the total distance for at least two different sample orderings."
