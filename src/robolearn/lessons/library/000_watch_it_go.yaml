id: 000_watch_it_go
title: Watch It, Then Change It
key_stage: KS1
reading_age: 5
ct_concepts: [sequence]
curriculum_refs:
  - "DfE 'Computing programmes of study: Key Stages 1 and 2' (DfE-00171-2013), KS1: understand what algorithms are; how they are implemented as programs on digital devices; and that programs execute by following precise and unambiguous instructions."
prereqs: []
terrain: earth
glossary:
  run: "Make the rover do the program."
  program: "A list of steps for the rover to do, one after another."
intro: |
  This is a program.
  It is a list of steps for the rover.
  This one has one step: drive 1 metre.
  Press Run and watch the rover do it.
  Then change 1 to 2 and Run it again.
starter_code: |
  move_forward(1)
allowed_constructs: [function_call]
max_lines: 4
world:
  base: [1.0, 1.0]
  samples:
    - [3.0, 1.0]
  obstacles: []
  width: 6.0
  height: 6.0
solution_code: |
  move_forward(2)
success_criteria:
  - min_distance_travelled: 2.0
  - no_collisions: true
hints:
  on_failure:
    - "Press Run once and watch. Then change the 1 in move_forward(1) to 2."
    - "Your finished step should say move_forward(2)."
