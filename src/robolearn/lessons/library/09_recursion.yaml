id: 09_recursion
title: Recursion (KS4 stretch)
key_stage: KS4
ct_concepts: [recursion, functions]
curriculum_refs:
  - "DfE 'Computer Science GCSE subject content' (DfE-00094-2015), section 3 'programming techniques': understand the use of recursion and the recursive resolution of base cases."
  - "BCS Csizmadia et al., 2015: recursion as a problem-solving construct."
prereqs: [06_functions]
terrain: space
intro: |
  Draw a square spiral by calling a function that calls itself with a
  smaller step. Recursion lets you describe an infinite-looking pattern
  with just a few lines of code -- the base case stops the spiral.
  Call pen_down() first if you want the rover to leave a trail as it goes.
  The spiral drives the same shape either way, so the pen is yours to choose.
starter_code: |
  def spiral(step):
      if step < 0.5:
          return
      move_forward(step)
      turn_left(90)
      spiral(step - 0.5)

  spiral(1.0)
allowed_constructs: [function_def, function_call, if, comparison, recursion, return, arithmetic]
max_lines: 12
world:
  base: [5.0, 5.0]
  samples: []
  obstacles: []
  width: 10.0
  height: 10.0
solution_code: |
  def spiral(step):
      if step < 0.5:
          return
      move_forward(step)
      turn_left(90)
      spiral(step - 0.5)

  pen_down()
  spiral(3.0)
success_criteria:
  - min_distance_travelled: 8.0
  - max_battery_used: 80.0
  - no_collisions: true
  - uses_construct: recursion
hints:
  on_failure:
    - "If the rover runs off the arena, your starting step is too big -- try spiral(2.0)."
    - "Don't forget the base case (the if step < 0.5: return) or the function recurses forever."
