id: 02_move_turn
title: Move and turn
key_stage: KS3
ct_concepts: [sequence]
curriculum_refs:
  - "DfE Computing programmes of study: Key Stage 3, item 4 (design abstractions)"
prereqs: [01_hello_rover]
terrain: earth
intro: |
  The rover can do more than drive forwards. Use turn_left and turn_right
  to change its heading. Build a short path that ends at the sample patch.
starter_code: |
  move_forward(3)
  turn_left(90)
  move_forward(3)
allowed_constructs: [function_call]
max_lines: 8
world:
  base: [1.0, 1.0]
  samples:
    - [4.0, 4.0]
  obstacles: []
  width: 6.0
  height: 6.0
success_criteria:
  - samples_collected: 1
  - max_battery_used: 15.0
  - no_collisions: true
hints:
  on_failure:
    - "After your first move_forward the rover is east of the base. You need to turn left and drive again to reach (4, 4)."
    - "Remember to call collect_sample() once the rover sits on top of the patch."
