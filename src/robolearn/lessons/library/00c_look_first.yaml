id: 00c_look_first
title: Look Before You Move
key_stage: KS2
reading_age: 10
ct_concepts: [selection]
curriculum_refs:
  - "DfE 'Computing programmes of study: Key Stages 1 and 2' (DfE-00171-2013), KS2: use sequence, selection, and repetition in programs; work with variables and various forms of input and output."
prereqs: [00b_repeat_square]
terrain: mars
glossary:
  sensor: "A part that lets the rover measure the world around it, like its eyes."
  if: "Do something ONLY when a question is true."
  obstacle: "A rock or wall in the way that the rover must not hit."
intro: |
  A clever rover looks before it moves.
  "obstacle_ahead()" asks the sensor a yes/no question:
  is there a rock right in front of me?
  Press Run first and watch the rover hit the rock.
  Then add "if obstacle_ahead():" and a turn ABOVE the move,
  so it looks before it drives.
starter_code: |
  move_forward(3)
allowed_constructs: [function_call, if]
max_lines: 8
world:
  base: [1.0, 1.0]
  samples: []
  obstacles:
    # Directly AHEAD of the start pose (rover begins at [1,1] facing east).
    # At [1.0, 2.2] the rock sat due north, perpendicular to the heading, so
    # obstacle_ahead() was never True: the if-body was dead code and the
    # starter passed only because it never ran. Worse, turn_left(90) - the
    # escape the lesson teaches - pointed straight AT that rock. Ahead on the
    # x axis makes the sensor question real and turning north the safe way out.
    # Close enough to trip obstacle_ahead(), whose default threshold is 0.5 m
    # (rover_api.obstacle_ahead). lidar_distance is measured centre-to-surface,
    # so this rock reads 0.40 m at the start pose (measured) and the sensor
    # question is genuinely True. Anything from x=1.9 outward reads >= 0.5 and
    # leaves the if-body dead, which is what the old placement did.
    - {x: 1.8, y: 1.0, r: 0.4}
  width: 6.0
  height: 6.0
success_criteria:
  - min_distance_travelled: 2.5
  - uses_construct: if
  - no_collisions: true
hints:
  on_failure:
    - "Ask the sensor first: 'if obstacle_ahead():' then turn out of the way."
    - "After the if, drive forward. Keep the move_forward OUTSIDE the if so it always runs."
