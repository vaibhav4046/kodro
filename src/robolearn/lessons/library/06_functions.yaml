id: 06_functions
title: Functions
key_stage: KS3
ct_concepts: [functions, decomposition]
curriculum_refs:
  - "DfE 'Computing programmes of study: Key Stages 3 and 4' (DfE-00191-2013), KS3 attainment target 6: appropriate ways to design and develop modular programs that use procedures or functions."
  - "BCS Csizmadia et al., 2015: decomposition and abstraction."
prereqs: [05_iteration]
terrain: mars
intro: |
  Wrap the "drive then turn" pattern in a function so you can call it many
  times. Functions let you give a meaningful name to a sequence of
  instructions -- this is called "decomposition".
starter_code: |
  def hop():
      move_forward(2)
      turn_left(90)

  hop()
  hop()
  hop()
  hop()
allowed_constructs: [function_def, function_call]
max_lines: 14
world:
  base: [3.0, 3.0]
  samples:
    - [5.0, 3.0]
    - [5.0, 5.0]
    - [3.0, 5.0]
    - [3.0, 3.0]
  obstacles: []
  width: 8.0
  height: 8.0
success_criteria:
  - samples_collected: 4
  - max_battery_used: 60.0
  - uses_construct: function_def
hints:
  on_failure:
    - "Define hop() once at the top, then call it four times to walk a square."
    - "Add collect_sample() inside hop() so each corner picks up its patch."
