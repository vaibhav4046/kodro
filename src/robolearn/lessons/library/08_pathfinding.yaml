id: 08_pathfinding
title: Pathfinding basics
key_stage: KS3
ct_concepts: [iteration, selection, decomposition]
curriculum_refs:
  - "DfE 'Computing programmes of study: Key Stages 3 and 4' (DfE-00191-2013), KS3 attainment target 5 (compare the utility of alternative algorithms)."
  - "DfE 'Computer Science GCSE subject content' (DfE-00094-2015), section 2: algorithms (search and traversal)."
prereqs: [06_functions, 04_selection]
terrain: mars
intro: |
  There is a rock in the way. Combine selection (if / else) and iteration
  (while) to drive around it, collect every sample, and return to base.
starter_code: |
  # Drive east, dodge the rock, fetch the sample, then return.
  for _ in range(4):
      move_forward(1)
  turn_right(90)
  move_forward(1)
  turn_left(90)
  move_forward(2)
  turn_left(90)
  move_forward(1)
  turn_right(90)
  for _ in range(3):
      move_forward(1)
  collect_sample()
  turn_left(180)
  for _ in range(8):
      move_forward(1)
allowed_constructs: [while, if, function_def, function_call, comparison]
max_lines: 22
world:
  base: [1.0, 5.0]
  samples:
    - [9.0, 5.0]
  obstacles:
    - {x: 5.0, y: 5.0, r: 0.4}
  width: 10.0
  height: 10.0
success_criteria:
  - samples_collected: 1
  - returns_to_base: true
  - no_collisions: true
hints:
  on_failure:
    - "Did the rover get stuck? Add a log() call inside the loop to see which branch fires each iteration."
    - "If the rover never reaches the sample, increase the distance in your else branch."
