id: 04_selection
title: Selection (if / else)
key_stage: KS3
ct_concepts: [selection]
curriculum_refs:
  - "DfE 'Computing programmes of study: Key Stages 3 and 4' (DfE-00191-2013), KS3 subject content: understand simple Boolean logic and some of its uses in circuits and programming."
  - "BCS Csizmadia et al., 2015: selection as a control-flow primitive."
prereqs: [03_sequence]
terrain: mars
intro: |
  A rock sits between the rover and the sample patch.
  The starter program already asks the sensor whether something is in the
  way, and drives round it when the answer is yes.
  Run it and watch: the rover ends up right on the patch, but comes home
  empty. Add the one line that picks the sample up.
starter_code: |
  if obstacle_ahead(2.0):
      turn_left(90)
      move_forward(1)
      turn_right(90)
      move_forward(4)
      turn_right(90)
      move_forward(1)
allowed_constructs: [function_call, if, comparison]
max_lines: 10
world:
  base: [1.0, 1.0]
  samples:
    - [5.0, 1.0]
  obstacles:
    - {x: 3.0, y: 1.0, r: 0.4}
  width: 6.0
  height: 6.0
success_criteria:
  - samples_collected: 1
  - no_collisions: true
  - uses_construct: if
hints:
  on_failure:
    - "The rover finishes on the patch but never picks it up. Add collect_sample() as the last line."
    - "obstacle_ahead(2.0) asks whether anything is within 2 metres ahead. Try printing it with log() to see when it is True."
