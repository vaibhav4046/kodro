id: 01_hello_rover
title: Hello, Rover!
key_stage: KS3
ct_concepts: [sequence]
curriculum_refs:
  - "DfE 'Computing programmes of study: Key Stages 3 and 4' (DfE-00191-2013), KS3 subject content: use two or more programming languages, at least one of which is textual, to solve a variety of computational problems."
  - "BCS 'Computational Thinking - A Guide for Teachers' (Csizmadia et al., 2015): sequence as a foundation construct."
prereqs: []
terrain: earth
intro: |
  Welcome to Kodro. Your first job is to give the rover three
  instructions in order: drive forward, beep, and write a short message to
  the console. Read each line of code from top to bottom -- the rover
  performs them one after another. This is called a "sequence".
starter_code: |
  move_forward(2)
  beep(1)
  log("hello rover")
allowed_constructs: [function_call]
max_lines: 8
world:
  base: [1.0, 1.0]
  samples: []
  obstacles: []
  width: 6.0
  height: 6.0
success_criteria:
  - min_distance_travelled: 1.5
  - max_battery_used: 5.0
  - no_collisions: true
hints:
  on_failure:
    - "Check that you call all three functions, in this exact order: move_forward, beep, log."
    - "Make sure each function name is spelled correctly and ends with parentheses."
