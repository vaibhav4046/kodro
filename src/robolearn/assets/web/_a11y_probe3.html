<!doctype html><meta charset=utf8>
<iframe id=f src="http://localhost:8099/cap.html?open=help" style="width:1280px;height:800px"></iframe>
<pre id=out></pre>
<script>
const out=document.getElementById('out');
function log(s){out.textContent+=s+"\n";}
window.addEventListener('load',()=>setTimeout(()=>{
 try{
  const doc=document.getElementById('f').contentDocument;
  const win=document.getElementById('f').contentWindow;
  const modal=doc.querySelector('.modal[aria-modal="true"]');
  log('modal present: '+!!modal);
  log('activeElement in modal? '+(modal&&modal.contains(doc.activeElement)));
  log('activeElement='+doc.activeElement.tagName+' label='+((doc.activeElement.getAttribute&&doc.activeElement.getAttribute('aria-label'))||(doc.activeElement.textContent||'').trim().slice(0,20)));
  // Escape closes?
  win.dispatchEvent(new win.KeyboardEvent('keydown',{key:'Escape',bubbles:true}));
  setTimeout(()=>{
    log('after Escape, modal present: '+!!doc.querySelector('.modal[aria-modal="true"]'));
    log('after Escape, activeElement='+doc.activeElement.tagName+' label='+((doc.activeElement.getAttribute&&doc.activeElement.getAttribute('aria-label'))||''));
  },300);
 }catch(e){log('ERR '+e.message);}
},6500));
</script>
