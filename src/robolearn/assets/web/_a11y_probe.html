<!doctype html><meta charset=utf8>
<iframe id=f src="http://localhost:8099/cap.html" style="width:1280px;height:800px"></iframe>
<pre id=out></pre>
<script>
const out=document.getElementById('out');
function log(s){out.textContent+=s+"\n";}
window.addEventListener('load',()=>setTimeout(()=>{
  try{
    const doc=document.getElementById('f').contentDocument;
    const win=document.getElementById('f').contentWindow;
    // 1. skip link target focusability
    const tgt=doc.getElementById('editor-main');
    log('editor-main tabindex='+tgt.getAttribute('tabindex'));
    tgt.focus();
    log('after .focus() activeElement is main? '+(doc.activeElement===tgt));
    log('activeElement tag='+doc.activeElement.tagName+' cls='+doc.activeElement.className);
    // 2. focus order: list tabbable elements in DOM order
    const sel='a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])';
    const tabbables=[...doc.querySelectorAll(sel)].filter(e=>e.offsetParent!==null||e.getClientRects().length);
    log('TABBABLE COUNT='+tabbables.length);
    tabbables.slice(0,40).forEach((e,i)=>{
      const lbl=e.getAttribute('aria-label')||e.getAttribute('title')||(e.textContent||'').trim().slice(0,32)||'('+e.tagName+')';
      log(i+': <'+e.tagName.toLowerCase()+'> ti='+(e.tabIndex)+' :: '+lbl);
    });
  }catch(e){log('ERR '+e.message);}
},6000));
</script>
