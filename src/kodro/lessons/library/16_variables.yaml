id: 16_variables
title: One name, used twice
key_stage: KS2
reading_age: 9
ct_concepts: [sequence, abstraction]
curriculum_refs:
  - "DfE 'Computing programmes of study: Key Stages 1 and 2' (DfE-00171-2013), KS2: work with variables and various forms of input and output."
  - "DfE 'Computing programmes of study: Key Stages 3 and 4' (DfE-00191-2013), KS3 subject content: use ... variables ... appropriately."
# 00a_turn_the_corner, not 03_sequence. This is a KS2 lesson, and 03_sequence is
# KS3, so requiring it pointed a KS2 pupil at a lesson outside their own section
# of the browser and kept this lesson out of the recommender until they attempted
# a KS3 one. 00a is also the better teacher for it on the merits: its solution is
# move_forward(2) / turn_left(90) / move_forward(2), the exact shape of the
# program below, so the pupil has already written the same number twice by hand.
# Naming it is then a fix for something they felt, not a rule they were told.
prereqs: [00a_turn_the_corner]
terrain: earth
glossary:
  variable: "A name that remembers a value. Use the name and you get the value."
  # collect_sample() is in the starter code and no KS1 or KS2 lesson before this
  # one uses it -- 03_sequence did, which is what the old KS3 prereq was quietly
  # covering. Repointing the prereq without this would have swapped a broken
  # ordering for unexplained jargon, so the call is defined here instead.
  sample: "A marker on the ground for the rover to pick up. The flags in this lesson are samples."
  collect_sample: "Picks up the sample the rover is standing on. It is already written for you here."
intro: |
  Two flags, and both are the same distance away: 2 metres east, then
  2 metres north.
  The program stores that distance in a variable called step, and uses the
  name twice. Right now step is 1, which is too short for BOTH moves.
  Change the number ONCE, and watch both moves change with it.
  That is what a variable is for.
starter_code: |
  step = 1
  move_forward(step)
  collect_sample()
  turn_left(90)
  move_forward(step)
  collect_sample()
allowed_constructs: [function_call, assignment]
max_lines: 10
world:
  base: [1.0, 1.0]
  samples:
    - [3.0, 1.0]
    - [3.0, 3.0]
  obstacles: []
  width: 6.0
  height: 6.0
solution_code: |
  step = 2
  move_forward(step)
  collect_sample()
  turn_left(90)
  move_forward(step)
  collect_sample()
success_criteria:
  - samples_collected: 2
  - no_collisions: true
  # The lesson is about the variable, so the variable is marked. A dead store
  # does not count (grader liveness): the name has to be read somewhere, which
  # is exactly what "work with variables" means.
  - uses_construct: assignment
hints:
  on_failure:
    - "Both flags are 2 metres away. Change step = 1 to step = 2, in one place only."
    - "Notice you did NOT have to change the move_forward lines. The name step carries the new value to both of them."
