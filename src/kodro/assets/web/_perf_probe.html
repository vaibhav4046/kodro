<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kodro perf probe</title><link rel="stylesheet" href="styles.css" />
</head>
<body>
  <script>
    (function () {
      // Match cap.html: mark onboarded, force 3D view, set quality from ?q
      try {
        localStorage.setItem('or_onboarded', '1');
        var q = new URLSearchParams(location.search);
        var qq = q.get('q'); if (qq) localStorage.setItem('kodro_quality', qq);
        localStorage.setItem('or_view3d', '1');
      } catch (e) { void e; }
      window.__CAP = {};
    })();
  </script>
  <div id="root"></div>
  <div id="probe-out" style="position:fixed;left:0;top:0;z-index:99999;background:#000;color:#0f0;font:12px monospace;padding:6px;max-width:640px;white-space:pre-wrap"></div>
  <script src="vendor/react.production.min.js"></script>
  <script src="vendor/react-dom.production.min.js"></script>
  <script src="vendor/three.min.js"></script>
  <script src="interpreter.js"></script>
  <script src="sound.js"></script>
  <script src="bridge.js"></script>
  <script src="bundle.js"></script>
  <script>
    (function () {
      var out = document.getElementById('probe-out');
      function log(s) { out.textContent += s + '\n'; }
      function mb(x) { return (x / 1048576).toFixed(1); }
      var mem = window.performance && window.performance.memory;

      // ---- Phase 1: FPS sampling during idle 3D render (~3s) ----
      // Then trigger a program run and sample FPS during the run.
      var frames = [];
      var lastT = performance.now();
      var rafId = 0;
      var phase = 'settle';
      function fpsTick() {
        var now = performance.now();
        frames.push(now - lastT);
        lastT = now;
        rafId = requestAnimationFrame(fpsTick);
      }
      function summarize(arr) {
        if (!arr.length) return 'n/a';
        var s = arr.slice().sort(function (a, b) { return a - b; });
        var med = s[Math.floor(s.length / 2)];
        var p95 = s[Math.floor(s.length * 0.95)];
        var max = s[s.length - 1];
        var avgFps = 1000 / (arr.reduce(function (a, b) { return a + b; }, 0) / arr.length);
        var jank = arr.filter(function (d) { return d > 50; }).length;
        return 'frames=' + arr.length + ' avgFps=' + avgFps.toFixed(1) +
          ' medMs=' + med.toFixed(1) + ' p95Ms=' + p95.toFixed(1) +
          ' maxMs=' + max.toFixed(1) + ' jank(>50ms)=' + jank;
      }

      function clickTerrain(label) {
        var btns = [].slice.call(document.querySelectorAll('.terrain-btn'));
        for (var i = 0; i < btns.length; i++) {
          if ((btns[i].textContent || '').trim().indexOf(label) === 0) { btns[i].click(); return true; }
        }
        return false;
      }
      function clickRun() {
        var b = [].slice.call(document.querySelectorAll('.ctrl'));
        for (var i = 0; i < b.length; i++) { if ((b[i].textContent || '').indexOf('Run') >= 0) { b[i].click(); return true; } }
        return false;
      }

      // Wait for the app + 3D canvas to mount.
      var waited = 0;
      var boot = setInterval(function () {
        waited += 100;
        var cv = document.querySelector('.viewport3d canvas');
        if (cv || waited > 8000) {
          clearInterval(boot);
          if (!cv) { log('BOOT FAIL: no 3D canvas after 8s'); log('DONE'); return; }
          log('boot: 3D canvas present at ' + waited + 'ms');
          if (mem) log('heap@boot=' + mb(mem.usedJSHeapSize) + 'MB');
          runScenario();
        }
      }, 100);

      function runScenario() {
        // Phase A: idle FPS for 3s
        lastT = performance.now();
        rafId = requestAnimationFrame(fpsTick);
        setTimeout(function () {
          cancelAnimationFrame(rafId);
          log('IDLE 3D fps: ' + summarize(frames));
          if (mem) log('heap@afterIdle=' + mb(mem.usedJSHeapSize) + 'MB');

          // Phase B: run a program, sample FPS during run
          frames = [];
          clickRun();
          lastT = performance.now();
          rafId = requestAnimationFrame(fpsTick);
          setTimeout(function () {
            cancelAnimationFrame(rafId);
            log('DURING-RUN 3D fps: ' + summarize(frames));
            if (mem) log('heap@afterRun=' + mb(mem.usedJSHeapSize) + 'MB');
            worldSwitchLoop();
          }, 4000);
        }, 3000);
      }

      // Phase C: cycle worlds N times, sample heap after each (memory-growth test)
      function worldSwitchLoop() {
        var order = ['City', 'Room', 'Earth', 'Mars', 'Underwater', 'Space'];
        var cycles = 3;
        var seq = [];
        for (var c = 0; c < cycles; c++) for (var i = 0; i < order.length; i++) seq.push(order[i]);
        var idx = 0;
        var heapSamples = [];
        if (mem) heapSamples.push(mem.usedJSHeapSize);
        function step() {
          if (idx >= seq.length) {
            // Force GC opportunity by waiting, then final sample.
            setTimeout(function () {
              if (mem) {
                var start = heapSamples[0], end = mem.usedJSHeapSize;
                log('WORLD-SWITCH heap: start=' + mb(start) + 'MB end=' + mb(end) +
                  'MB delta=' + mb(end - start) + 'MB over ' + seq.length + ' switches');
                var peak = Math.max.apply(null, heapSamples);
                log('  peak=' + mb(peak) + 'MB samples=' + heapSamples.map(mb).join(',') );
              } else {
                log('WORLD-SWITCH: performance.memory unavailable (' + seq.length + ' switches completed)');
              }
              log('DONE');
            }, 1500);
            return;
          }
          var ok = clickTerrain(seq[idx]);
          idx++;
          setTimeout(function () {
            if (mem) heapSamples.push(mem.usedJSHeapSize);
            step();
          }, 700);
        }
        log('world-switch loop: ' + seq.length + ' switches');
        step();
      }
    })();
  </script>
</body></html>
