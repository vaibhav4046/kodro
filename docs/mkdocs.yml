site_name: Kodro
site_description: Offline AI-assisted robotics design and simulation platform. Build a robot, program it, validate it in a 3D world, all on one laptop.
site_url: https://vaibhav4046.github.io/robolearn
repo_url: https://github.com/vaibhav4046/robolearn
repo_name: vaibhav4046/robolearn
docs_dir: .
site_dir: ../site

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy

nav:
  - Home: index.md
  - For teachers:
      - Getting started: teachers/getting-started.md
      - Classroom setup: teachers/classroom-setup.md
      - Curriculum mapping: teachers/curriculum-mapping.md
  - For pupils:
      - API cheatsheet: pupils/api-cheatsheet.md
  - For developers:
      - Architecture: developers/architecture.md
      - Extending lessons: developers/extending-lessons.md
      - Decision log: developers/decision-log.md
      - Test evidence: developers/test-evidence.md
      - Evaluation: developers/evaluation.md
  - Dissertation (draft):
      - Overview: dissertation/README.md
      - Introduction: dissertation/00-introduction.md
      - Background: dissertation/01-background.md
      - Design & architecture: dissertation/02-design.md
      - Implementation: dissertation/03-implementation.md
      - Conclusion & future work: dissertation/04-conclusion.md
      - Glossary & abbreviations: dissertation/05-glossary.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
