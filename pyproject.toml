[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "robolearn"
version = "2.0.0"
description = "Offline AI-assisted robotics design and simulation platform (Kodro): build a robot, program it, validate it in a 3D world, all on one laptop."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "RoboLearn contributors" }]
keywords = ["education", "stem", "robotics", "simulator", "ks3", "ks4"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: Games/Entertainment :: Simulation",
]
dependencies = [
    "pygame-ce>=2.5",
    "pymunk>=6.6",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "sv-ttk>=2.6",
    "pywebview>=5.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    "hypothesis>=6.100",
    "ruff>=0.6.0",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "types-PyYAML",
    "reportlab>=4.0",
    "pyinstaller>=6.6",
    "mkdocs-material>=9.5",
]
# URDF import/export interop (see src/robolearn/interop/urdf_io.py). Optional so
# the core stays light; yourdfpy is the lenient reader, urdf_parser_py the ROS
# reference parser for the parity check.
interop = [
    "yourdfpy>=0.0.56",
    "urdf_parser_py>=0.0.4",
]
# Gymnasium RL wrapper (see src/robolearn/envs/kodro_env.py). Optional so the
# core stays light; importing robolearn.envs registers robolearn/KodroEnv-v0.
rl = [
    "gymnasium>=1.0",
]

[project.scripts]
# `kodro` is the product name, so it launches the product. It used to launch
# the headless batch runner, which meant typing the name of the application
# started something that is not the application. The batch runner now sits in
# the kodro-* family with the other non-UI tools. `robolearn` is kept as an
# alias because it is the package name and it is in older documentation.
kodro = "robolearn.__main__:main"
robolearn = "robolearn.__main__:main"
kodro-bench = "robolearn.bench:main"
kodrobench = "robolearn.kodrobench:main"
kodro-prove = "robolearn.prove:main"
kodro-mcp = "robolearn.mcp.server:main"

[project.urls]
Homepage = "https://github.com/vaibhav4046/robolearn"
Issues = "https://github.com/vaibhav4046/robolearn/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/robolearn"]
# The web assets (.jsx/.js/.css/bundle.js) live under the package and are pulled
# in by `packages` + this `artifacts` glob. The old force-include table re-mapped
# the SAME files a second time, so hatch tried to add each asset twice and the
# wheel build failed ("A second file is being added at the same path"). One
# inclusion mechanism only.
artifacts = [
    "src/robolearn/assets/web/**/*",
]

[tool.hatch.build.targets.sdist]
include = [
    "src/robolearn",
    "tests",
    "docs",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
]

# ---------- ruff -----------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["build", "dist", ".hatch", "site"]

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pycodestyle / pyflakes
    "I",                # isort
    "B",                # bugbear
    "UP",               # pyupgrade
    "D",                # pydocstyle
    "ANN",              # annotations
    "RUF",              # ruff-specific
    "SIM",              # simplify
    "C4",               # comprehensions
    "PTH",              # use pathlib
    "TID",              # tidy imports
]
ignore = [
    "D203",   # 1 blank line before class — conflicts with D211
    "D213",   # multi-line summary second line — conflicts with D212
    "ANN401", # `Any` allowed where genuinely needed
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN", "S101"]
"scripts/**" = ["D", "ANN", "INP001"]
"examples/**" = ["D", "ANN", "INP001"]
"src/robolearn/__main__.py" = ["D"]

[tool.ruff.format]
line-ending = "lf"
quote-style = "double"
indent-style = "space"
# Ruff is the PYTHON formatter here. Recent versions also format Python inside
# markdown code fences, which broke CI the moment that graduated out of preview:
# the dependency is pinned only as ruff>=0.6.0, so a tool release changed the
# build without a line of this project changing.
#
# Excluding markdown is the right answer rather than a workaround. The teacher
# worksheets under docs/ contain example programs that are deliberately
# incomplete, half-written or wrong, because that is what a worksheet is for.
# Auto-formatting them would silently "fix" the very examples a pupil is meant
# to find the fault in. Python source is still formatted everywhere it lives.
exclude = ["*.md"]

# ---------- mypy -----------------------------------------------------------

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
files = ["src", "tests"]
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_reexport = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "pygame.*",
    "pymunk.*",
    "tkcode.*",
    "yourdfpy.*",
    "urdf_parser_py.*",
    "reportlab.*",
    "gymnasium.*",
    "numpy.*",
]
ignore_missing_imports = true

# The gymnasium wrapper is optional (rl extra): on a checkout without it,
# ignore_missing_imports turns gymnasium into Any, and gym.Env becomes an Any
# base class. Permit that one subclassing so mypy stays green with and without
# the extra installed (CI runs without it).
[[tool.mypy.overrides]]
module = ["robolearn.envs.kodro_env"]
disallow_subclassing_any = false

# ---------- pytest ---------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# Put the repo root on sys.path so tests can import the top-level scripts/
# namespace package (e.g. test_lessons_export -> scripts.export_lessons) under a
# bare `pytest` invocation on CI, not only under `python -m pytest` locally.
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=robolearn",
    "--cov-branch",
    "--cov-report=term-missing",
    # Coverage gate progresses per the autonomous-mode override:
    # 0 (Tasks 1-3) -> 60 (after Task 4) -> 75 (after Task 10) -> 85 (after Task 18).
    "--cov-fail-under=85",
]
# No custom markers are declared: with --strict-markers an unused declaration is
# an invitation to write a selector nothing honours. tests/conftest.py applies
# pytest-cov's built-in ``no_cover`` marker, which pytest-cov registers itself.
markers = []

[tool.coverage.run]
source = ["src/robolearn"]
branch = true
# The sandbox executor (runtime/executor.py) runs pupil code in a daemon thread
# and can hard-kill it via PyThreadState_SetAsyncExc. Without thread-concurrency
# support, coverage's data lock can deadlock when it traces that thread mid-kill,
# which intermittently hung pytest (and risked the same on CI, which runs
# coverage under --timeout-method=thread). Declaring the concurrency model fixes it.
concurrency = ["thread"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
