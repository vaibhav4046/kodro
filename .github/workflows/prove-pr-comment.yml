name: Prove contract summary

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  contract-summary:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Kodro
        run: python -m pip install -e .

      - name: Replay deterministic contracts
        id: prove
        continue-on-error: true
        run: >-
          python -m kodro.prove
          --runs 5
          --seed-root 4046
          --manifest prove-manifest.json
          --report prove-report.md
          --verify-reproducible

      - name: Comment the contract result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- kodro-prove-contracts -->';
            let body = `${marker}\n## Deterministic Prove contracts\n\n`;
            if (!fs.existsSync('prove-manifest.json')) {
              body += 'The runner did not emit a manifest. Inspect the workflow log.\n';
            } else {
              const manifest = JSON.parse(fs.readFileSync('prove-manifest.json', 'utf8'));
              body += '| Contract | Seeded runs | Verdict | Mean distance | Mean battery |\n';
              body += '| --- | ---: | --- | ---: | ---: |\n';
              for (const item of manifest.contracts) {
                const a = item.aggregate;
                body += `| ${item.title} | ${a.passed_runs}/${a.runs} | ${a.verdict.toUpperCase()} | ${a.mean_distance_m.toFixed(3)} m | ${a.mean_battery_pct.toFixed(2)}% |\n`;
              }
              body += `\nOverall: **${manifest.verdict.toUpperCase()}**. Engine: \`${manifest.engine.id}/${manifest.engine.version}\`. Seed root: \`${manifest.seed_root}\`.\n`;
              body += `\n${manifest.evidence_boundary}\n`;
              body += '\nThe model assistant is advisory and cannot change these verdicts.\n';
            }
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const previous = comments.find(comment => comment.user.type === 'Bot' && comment.body.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Enforce the result
        if: steps.prove.outcome != 'success'
        run: exit 1
