name: Astra zero-cost runtime contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  astra-provider:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify Ollama-only runtime and unavailable Astra presentation
        run: node scripts/qa_astra_provider.mjs
