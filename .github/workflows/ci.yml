name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}
    # The headless macOS runner has no Aqua window server, so Tk
    # intermittently segfaults under the GUI-heavy suite (a platform
    # limitation, not a product bug). Keep macOS as an informational leg so
    # it still reports, but only Linux (xvfb) and Windows gate the build.
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    env:
      SDL_VIDEODRIVER: dummy
      PYTHONIOENCODING: utf-8
      # The JS<->Python lesson-parity test (test_web_lesson_parity.py) skips
      # its JS half when Node is off PATH. The runner images ship Node today,
      # but that is incidental -- if a future image drops it, the JS half would
      # skip silently and a verb desync could land green. setup-node below
      # pins Node so it is always present; this flag makes the parity test FAIL
      # (not skip) if it ever isn't, so the guarantee can never erode silently.
      ROBOLEARN_REQUIRE_NODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install xvfb (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy
        run: mypy src/robolearn

      # --timeout converts any hung GUI/thread test into a fast failure
      # with a full per-thread traceback instead of burning to the 6h cap.
      # thread method works cross-platform (signal/SIGALRM does not).
      #
      # The coverage gate is a property of the whole suite, so it is enforced
      # once on the full Linux run (xvfb runs every test). Windows/macOS skip
      # a handful of GUI event-loop tests that hang headlessly, so they run
      # with --no-cov: they verify cross-platform behaviour, not coverage.
      # -rf prints a short summary line naming every failed test, so a flake
      # in a long run is identifiable from the log tail without scrolling.
      - name: Pytest (Linux with xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a pytest -rf --timeout=120 --timeout-method=thread

      - name: Pytest (Windows / macOS)
        if: runner.os != 'Linux'
        run: pytest -rf --timeout=120 --timeout-method=thread --no-cov

      - name: Upload coverage to artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage
          if-no-files-found: ignore
