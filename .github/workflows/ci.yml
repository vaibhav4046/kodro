name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}
    # The headless macOS runner has no Aqua window server, so Tk
    # intermittently segfaults under the GUI-heavy suite (a platform
    # limitation, not a product bug). Keep macOS as an informational leg so
    # it still reports, but only Linux (xvfb) and Windows gate the build.
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    env:
      SDL_VIDEODRIVER: dummy
      PYTHONIOENCODING: utf-8
      # The JS<->Python lesson-parity test (test_web_lesson_parity.py) skips
      # its JS half when Node is off PATH. The runner images ship Node today,
      # but that is incidental -- if a future image drops it, the JS half would
      # skip silently and a verb desync could land green. setup-node below
      # pins Node so it is always present; this flag makes the parity test FAIL
      # (not skip) if it ever isn't, so the guarantee can never erode silently.
      ROBOLEARN_REQUIRE_NODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install xvfb (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy
        run: mypy src/robolearn

      # Bundle-freshness gate: the shipped bundle.js is prebuilt from the .jsx
      # sources, and build_web.cjs --check exits 1 when the two drift. Without
      # this, a PR that edits a .jsx but forgets to rebuild would land a STALE
      # bundle (the app runs old code while the sources say otherwise). Pure
      # node, fast, cross-platform, and it also compiles every .jsx through the
      # vendored Babel -- so a syntax error in a source is caught here too.
      - name: Web bundle freshness
        run: node scripts/build_web.cjs --check

      # Cross-engine interpreter gate: builds the bundle and runs the RoverLang
      # parity suite in Node (no browser needed), so a JS-engine regression is
      # caught in CI, not only locally.
      - name: Web interpreter gate
        run: node scripts/qa_interpreter.mjs

      # Lesson-grader gate: pure Node, no browser, so it is cheap to run on every
      # leg. Guards the JS lesson grader (browser-mode submit/hint) against
      # regressions. The browser-driven gates (qa_web, qa_worlds) need headless
      # Chrome plus a served site and are run locally / pre-deploy, not here.
      - name: Web grader gate
        run: node scripts/qa_grader.mjs

      # Pure-physics gate: the collision / ray / coverage / trapezoid math
      # extracted from useSimEngine into sim-physics.js, tested headlessly with
      # no browser, so the kinematics now have unit coverage independent of the
      # React run engine.
      - name: Web physics gate
        run: node scripts/qa_physics.mjs

      - name: Web scenario evidence gate
        run: node scripts/qa_scenario_parity.mjs

      # Deterministic Prove gate: four declarative contracts run through the
      # existing Python rover engine. The test pins byte-identical manifests,
      # traceability fields, all required perturbations, regression comparison,
      # and proves a deliberately broken controller receives a FAIL verdict.
      - name: Deterministic Prove contracts
        run: python -m pytest tests/unit/test_prove.py -q --cov-fail-under=0

      # AI-facade gate: unit coverage for the browser assistant's pure string
      # logic in ai-web.jsx (normalizeApi / extractCode / stripFences /
      # looksLikeCode) -- the rover.X(cm) -> bare-metre rewrite, fence
      # extraction, prose stripping, and code-vs-question routing. Loads the
      # shipped facade under a window/fetch shim (no browser, no network) and
      # asserts its behaviour through the public surface. Pure node, all legs.
      - name: Web AI facade gate
        run: node scripts/qa_ai_web.mjs

      # Pupil-store gate: unit coverage for the on-device class register
      # (pupil-store.js) that gives the static browser build a real Teacher
      # dashboard. Asserts EMA parity with the desktop Python store (alpha=0.3),
      # the heatmap JSON shape, persistence, and corrupt-store safety under a
      # window/localStorage shim. Pure node, all legs.
      - name: Web pupil-store gate
        run: node scripts/qa_pupilstore.mjs

      # Honesty gate: pins the fixes that keep the product's numbers honest and
      # consistent - one physics formula for stopping distance across the design
      # check and the report, catalogue top speed badged APPROXIMATED, no
      # "honest error bars" or "perform cleanly" overpromises, AI prices labelled
      # as estimates. Runs the real motion model plus source assertions.
      - name: Web honesty gate
        run: node scripts/qa_honesty.mjs

      # Contrast gate: WCAG AA for the editor tab labels and the run-control
      # Reset label across EVERY theme, computed from the shipped styles.css
      # tokens. Catches a reverted appearance:none fix or a new/retuned theme
      # shipping an illegible control.
      - name: Web contrast gate
        run: node scripts/qa_contrast.mjs

      # Deterministic Node gates added after the original CI wiring. Each runs
      # in milliseconds-to-seconds with no browser: parts-catalogue citations,
      # memory-graph behaviour, GPU-tier classification, project storage
      # honesty, construct liveness parity, and the cross-engine fuzz (which
      # shells into the same Python this job already installed for pytest).
      - name: Parts catalogue gate
        run: node scripts/qa_parts.mjs

      - name: Memory graph gate
        run: node scripts/qa_memgraph.mjs

      - name: GPU capability gate
        run: node scripts/qa_gpucaps.mjs

      - name: Project storage honesty gate
        run: node scripts/qa_project_storage.mjs

      - name: Construct liveness parity gate
        run: node scripts/qa_construct_liveness.mjs

      - name: Cross-engine fuzz gate
        run: node scripts/qa_fuzz.mjs

      # Browser boot + privacy gate (qa_web): the ONLY browser-driven gate wired
      # into CI, and only on Linux. It builds the static web bundle and loads it
      # in headless Chrome to prove two things a green Python/Node CI otherwise
      # cannot: the app actually BOOTS (React mounts, the studio paints) and its
      # default load makes ZERO app-originated external requests (the coded proof
      # of "nothing leaves your machine"). Those 4 boot+privacy checks are the
      # high-value smoke.
      #
      # Chrome is installed explicitly rather than relied on as an incidental
      # runner preinstall (same reasoning as ROBOLEARN_REQUIRE_NODE above) and
      # pinned via CHROME_PATH so resolveChrome() picks it deterministically.
      # qa_web already passes --no-sandbox (required for Chrome under the CI user)
      # and warms Chrome + retries the boot spawn (ETIMEDOUT) up to 3x, so a cold
      # launch flake fails an attempt, not the job.
      #
      # Linux-only on purpose: the Windows/macOS runners differ in Chrome
      # availability and headless-GL behaviour, so gating them would add flake for
      # no extra signal. qa_worlds / qa_ui are deliberately NOT in CI -- they drive
      # 36+ world/robot combos through a Python static server and are too slow /
      # flake-prone for the gate; they stay local + pre-deploy.
      - name: Setup Chrome (Linux only, for qa_web)
        if: matrix.os == 'ubuntu-latest'
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Web boot + privacy gate (qa_web, Linux only)
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 10
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          node scripts/build_web.cjs --static
          node scripts/qa_web.mjs

      - name: Build split browser harness (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: node scripts/build_screenshot_harness.cjs

      - name: Start browser harness server (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          python -m http.server 8099 --directory src/robolearn/assets/web > /tmp/kodro-http.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8099/cap.html > /dev/null; then
              echo "Browser harness server is ready"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/kodro-http.log
          echo "Browser harness server did not become ready" >&2
          exit 1

      - name: UI paint gate (Linux only)
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 12
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          KODRO_QA_UI_REQUIRED: "1"
        run: node scripts/qa_ui.mjs --suite=paint

      - name: UI behaviour gate (Linux only)
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 25
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          KODRO_QA_UI_REQUIRED: "1"
        run: node scripts/qa_ui.mjs --suite=behaviour

      - name: UI layout gate (Linux only)
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 12
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          KODRO_QA_UI_REQUIRED: "1"
        run: node scripts/qa_ui.mjs --suite=layout

      - name: UI modal gate (Linux only)
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 15
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          KODRO_QA_UI_REQUIRED: "1"
        run: node scripts/qa_ui.mjs --suite=modals

      # --timeout converts any hung GUI/thread test into a fast failure
      # with a full per-thread traceback instead of burning to the 6h cap.
      # thread method works cross-platform (signal/SIGALRM does not).
      #
      # The coverage gate is a property of the whole suite, so it is enforced
      # once on the full Linux run (xvfb runs every test). Windows/macOS skip
      # a handful of GUI event-loop tests that hang headlessly, so they keep
      # coverage active but disable the percentage threshold: they verify
      # cross-platform behaviour, not coverage. Keeping the controller active
      # also avoids pytest-cov 7.1's --no-cov/no_cover pause bug.
      # -rf prints a short summary line naming every failed test, so a flake
      # in a long run is identifiable from the log tail without scrolling.
      - name: Pytest (Linux with xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a pytest -rf --timeout=120 --timeout-method=thread

      - name: Pytest (Windows / macOS)
        if: runner.os != 'Linux'
        run: pytest -rf --timeout=120 --timeout-method=thread --cov-fail-under=0

      - name: Upload coverage to artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage
          if-no-files-found: ignore
