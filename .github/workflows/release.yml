name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build ${{ matrix.os }} binary
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact-name: Kodro-linux
          - os: windows-latest
            artifact-name: Kodro-windows
          - os: macos-latest
            artifact-name: Kodro-macos
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Build binary
        run: python scripts/build_exe.py

      # Package exactly one clean, platform-named asset per OS. macOS
      # --windowed emits a kodro.app *directory*; uploading dist/* would
      # flatten it into junk files (Info.plist, CodeResources, ...), so zip
      # the bundle instead. Linux/Windows are single-file binaries.
      - name: Package release asset
        shell: bash
        run: |
          mkdir -p out
          if [ "$RUNNER_OS" = "Windows" ]; then
            # Headline: the pywebview desktop app (Kodro web UI). The Tk build
            # ships alongside as a fallback.
            # kodro-web.spec emits dist/Kodro.exe. This step used to test
            # for dist/RoboLearn.exe -- a name that has not existed since the
            # rename -- inside an `if` that swallowed the miss, so every
            # tagged release silently shipped ONLY the Tk fallback and dropped
            # the headline app. Copy it unconditionally so a missing headline
            # binary fails the release instead of quietly publishing without it.
            cp dist/Kodro.exe out/Kodro-windows.exe
            cp dist/kodro-tk.exe out/Kodro-windows-tk.exe
          elif [ "$RUNNER_OS" = "macOS" ]; then
            if [ -d dist/kodro.app ]; then
              (cd dist && zip -r -q ../out/Kodro-macos.zip kodro.app)
            else
              cp dist/kodro out/Kodro-macos
            fi
          else
            cp dist/kodro out/Kodro-linux
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: out/*

  publish-release:
    name: Publish GitHub release
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          files: dist/**/*
          generate_release_notes: true
