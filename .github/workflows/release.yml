name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build ${{ matrix.os }} binary
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact-name: robolearn-linux
          - os: windows-latest
            artifact-name: robolearn-windows
          - os: macos-latest
            artifact-name: robolearn-macos
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Build binary
        run: python scripts/build_exe.py

      # Package exactly one clean, platform-named asset per OS. macOS
      # --windowed emits a robolearn.app *directory*; uploading dist/* would
      # flatten it into junk files (Info.plist, CodeResources, ...), so zip
      # the bundle instead. Linux/Windows are single-file binaries.
      - name: Package release asset
        shell: bash
        run: |
          mkdir -p out
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp dist/robolearn.exe out/robolearn-windows.exe
          elif [ "$RUNNER_OS" = "macOS" ]; then
            if [ -d dist/robolearn.app ]; then
              (cd dist && zip -r -q ../out/robolearn-macos.zip robolearn.app)
            else
              cp dist/robolearn out/robolearn-macos
            fi
          else
            cp dist/robolearn out/robolearn-linux
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: out/*

  publish-release:
    name: Publish GitHub release
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
