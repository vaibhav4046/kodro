name: NextStep judge-surface patch

on:
  push:
    branches:
      - nextstep-2026-earthproof-ui
    paths:
      - .github/workflows/nextstep-ui-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nextstep-2026-earthproof-ui
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install focused test runner
        run: python -m pip install pytest
      - name: Apply approved EarthProof surface
        run: python scripts/nextstep_ui_patch.py
      - name: Rebuild web bundle
        run: node scripts/build_web.cjs
      - name: Focused judge-surface verification
        run: python -m pytest tests/unit/test_nextstep_judge_surface.py -q --confcutdir=tests/unit
      - name: Verify generated bundle freshness
        run: node scripts/build_web.cjs --check
      - name: Commit source and generated bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md NEXTSTEP_2026.md src/kodro/assets/web/app.jsx src/kodro/assets/web/styles.css src/kodro/assets/web/bundle.js
          git commit -m "feat(nextstep): surface EarthProof at Build [judge-ui]"
          git push origin HEAD:nextstep-2026-earthproof-ui
