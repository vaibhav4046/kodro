name: Astra zero-cost UI migration once

on:
  push:
    branches: [astra-server-proxy]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: astra-server-proxy
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply zero-cost Astra UI migration
        run: node scripts/_apply_astra_zero_cost_ui.mjs
      - name: Rebuild authoritative web bundle
        run: node scripts/build_web.cjs
      - name: Verify zero-cost runtime contract before committing
        run: node scripts/qa_astra_provider.mjs
      - name: Remove one-shot migration machinery
        run: git rm scripts/_apply_astra_zero_cost_ui.mjs .github/workflows/astra-zero-cost-ui-once.yml
      - name: Commit source and generated bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/kodro/assets/web/panels.jsx src/kodro/assets/web/bundle.js src/kodro/assets/web/sw.js
          git diff --cached --quiet && { echo "No migration changes produced"; exit 1; }
          git commit -m "fix: present Astra as unavailable zero-cost option"
          git push origin HEAD:astra-server-proxy
